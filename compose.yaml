x-frontend-origins: &frontend-origins
  Frontend__Origins__0: "http://localhost:${FRONTEND_PORT:-8088}"
  Frontend__Origins__1: "http://127.0.0.1:${FRONTEND_PORT:-8088}"
  Frontend__Origins__2: "http://localhost:4200"
  Frontend__Origins__3: "http://127.0.0.1:4200"

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:?Set ACCOUNTS_DB_PASSWORD in .env}
      TASKS_DB_PASSWORD: ${TASKS_DB_PASSWORD:?Set TASKS_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  accounts-api:
    build:
      context: backend
      args:
        API_PROJECT: TaskManager.Accounts.Api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *frontend-origins
      ASPNETCORE_ENVIRONMENT: Development
      Auth__PrivateKeyPath: /run/task-manager/accounts-private.pem
      Demo__Seed: ${DEMO_SEED:-false}
      ConnectionStrings__Accounts: Host=postgres;Database=accounts;Username=accounts_app;Password=${ACCOUNTS_DB_PASSWORD:?Set ACCOUNTS_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5081:8080"
    volumes:
      - type: bind
        source: ./.local/accounts-private.pem
        target: /run/task-manager/accounts-private.pem
        read_only: true
        bind:
          create_host_path: false

  tasks-api:
    build:
      context: backend
      args:
        API_PROJECT: TaskManager.Tasks.Api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *frontend-origins
      ASPNETCORE_ENVIRONMENT: Development
      Auth__PublicKeyPath: /run/task-manager/accounts-public.pem
      ConnectionStrings__Tasks: Host=postgres;Database=tasks;Username=tasks_app;Password=${TASKS_DB_PASSWORD:?Set TASKS_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5082:8080"
    volumes:
      - type: bind
        source: ./.local/accounts-public.pem
        target: /run/task-manager/accounts-public.pem
        read_only: true
        bind:
          create_host_path: false

  frontend:
    build: frontend
    depends_on:
      - accounts-api
      - tasks-api
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8088}:8080"
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - >-
          for (const url of ['http://127.0.0.1:8080/', 'http://accounts-api:8080/_internal/live', 'http://tasks-api:8080/_internal/live']) {
            const response = await fetch(url, { signal: AbortSignal.timeout(2000) });
            if (!response.ok) process.exit(1);
            await response.body?.cancel();
          }
      interval: 3s
      timeout: 8s
      retries: 20

volumes:
  postgres-data:
